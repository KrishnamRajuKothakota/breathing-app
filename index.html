<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Breathing practice timer with guided breathing techniques.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <title>Breathing Practice</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <h1>Breathing Practice</h1>

        <div class="selector">
            <label for="technique">Choose a technique:</label>
            <select id="technique"></select>
        </div>

        <div id="info" class="info-card">
            <h2 id="tech-name"></h2>
            <p id="tech-desc"></p>
            <p class="tip" id="tech-tip"></p>
        </div>

        <div class="controls">
            <button id="play-btn" class="btn primary">Play</button>
            <button id="stop-btn" class="btn secondary" disabled>Stop</button>
        </div>

        <div class="timer-section">
            <div class="phase-label" id="phase-action">Ready</div>
            <div class="instruction" id="phase-instruction">Select a technique and press Play</div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="time-row">
                <span id="phase-countdown">–</span>
                <span class="total-time">Total: <span id="elapsed">00:00</span></span>
            </div>
        </div>
    </div>

    <script src="static/script.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
        }
    </script>
</body>
</html>
